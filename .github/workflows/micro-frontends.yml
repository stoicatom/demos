name: Deploy Micro-Frontends Demos

# 独立于现有 pages.yml:仅构建并部署 micro-frontends/ 样例到 gh-pages 的子目录,
# 不影响 code-snippets 等现有内容(destination_dir + keep_files)。
on:
  push:
    branches:
      - master
    paths:
      - 'micro-frontends/**'
      - '.github/workflows/micro-frontends.yml'
  workflow_dispatch: # 支持手动触发

jobs:
  build-and-deploy:
    name: Build & Deploy Demos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@mf-demo/*..."

      - name: Build all demos
        # 换仓库名零改动:仓库名即部署 base 前缀
        env:
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/
          NODE_ENV: production
        run: pnpm --filter "@mf-demo/*" run build

      - name: Assemble dist
        run: node micro-frontends/scripts/assemble-dist.mjs dist

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # 从 dist 根部署,一次覆盖三类产物:
          #   dist/micro-frontends/*  → /micro-frontends/*  (各框架样例)
          #   dist/404.html           → /404.html           (GitHub Pages 全站 404 fallback;
          #                                                    子目录 404.html 不生效,必须放根目录)
          #   dist/.nojekyll          → /.nojekyll           (关闭 Jekyll,保留下划线开头资源)
          keep_files: true # 保留 gh-pages 上现有的 code-snippets 内容
          full_commit_message: 'deploy: micro-frontends demos ${{ github.sha }}'
