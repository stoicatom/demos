# memos —— nginx 反向代理配置(模板)
# 部署位置: 复制到远端 /var/www/nginx/conf.d/<你的域名>.conf
#
# 部署前替换两处占位符:
#   <MEMOS_DOMAIN>   → 你的 memos 子域名,如 memos.example.com
#   <CERT_DIR>       → 泛域名证书目录名,在服务器执行 `ls /var/www/nginx/certificates/` 查得
#
# 生效: docker exec nginx nginx -t && docker exec nginx nginx -s reload
server {
    listen 443 ssl http2;
    server_name <MEMOS_DOMAIN>;

    ssl_certificate      /etc/nginx/certificates/<CERT_DIR>/fullchain.cer;
    ssl_certificate_key  /etc/nginx/certificates/<CERT_DIR>/cert.key;

    # 上传体积上限 —— memos 支持图片/附件,放宽到 32M
    client_max_body_size 32m;

    location / {
        proxy_pass http://172.17.0.1:5230;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持 —— memos 实时更新需要
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

# HTTP 重定向 HTTPS
server {
    listen 80;
    server_name <MEMOS_DOMAIN>;
    return 301 https://$host$request_uri;
}
